<!DOCTYPE html>
<html>
<body>
<script type="module">
  import * as XLSX from 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/xlsx.mjs';
  fetch('Recursos/Banco/Hasta%2019%20Mayo.xls').then(res => res.arrayBuffer()).then(buffer => {
    const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    let output = "";
    for(let i=0; i<15; i++) {
        if(rows[i]) {
            let f = rows[i][0];
            output += `row ${i}: ${f instanceof Date ? 'DATE: ' + f.toISOString() : 'STRING: ' + f}\n`;
        }
    }
    document.body.innerHTML = "<pre id='output'>" + output + "</pre>";
  });
</script>
</body>
</html>
